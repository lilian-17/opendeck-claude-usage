<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
		.row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
		input[type="color"] { width: 48px; height: 28px; padding: 0; border: 1px solid #555; border-radius: 4px; background: none; cursor: pointer; }
		button { padding: 4px 10px; cursor: pointer; margin-top: 4px; }
		p { color: #999; font-size: 12px; }
		code { color: #ccc; }
	</style>
</head>
<body>
	<div class="row"><label for="workingColor" data-i18n="working">Thinking</label><input type="color" id="workingColor"></div>
	<div class="row"><label for="waitingColor" data-i18n="waiting">Needs you</label><input type="color" id="waitingColor"></div>
	<div class="row"><label for="doneColor" data-i18n="done">Done</label><input type="color" id="doneColor"></div>
	<div class="row"><label for="idleColor" data-i18n="idle">Idle</label><input type="color" id="idleColor"></div>
	<button id="reset" data-i18n="reset">Default colors</button>
	<button id="oled" data-i18n="oled">OLED black when idle</button>

	<p data-i18n="ack">Press the key to acknowledge “done”.</p>
	<p data-i18n="hooks">Requires the Claude Code hooks:<br><code>node hooks/install.js</code> in the plugin folder.</p>

	<script>
		const DEFAULTS = { workingColor: '#3b82f6', waitingColor: '#ef4444', doneColor: '#22c55e', idleColor: '#1f1e1d' };
		const fields = Object.keys(DEFAULTS).map((id) => document.getElementById(id));
		let ws, uuid, settings;

		const I18N = {
			fr: {
				working: 'Réfléchit',
				waiting: 'A besoin de toi',
				done: 'A fini',
				idle: 'Inactif',
				reset: 'Couleurs par défaut',
				oled: 'Inactif noir OLED',
				ack: 'Appuie sur la touche pour marquer « fini » comme vu.',
				hooks: 'Nécessite les hooks Claude Code :<br><code>node hooks/install.js</code> dans le dossier du plugin.',
			},
		};

		// English is written in the page; other languages replace each [data-i18n] text.
		function localize(info) {
			let lang;
			try {
				lang = JSON.parse(info).application.language;
			} catch {
				lang = navigator.language;
			}
			const strings = I18N[(lang || 'en').slice(0, 2).toLowerCase()];
			if (!strings) return;
			for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = strings[el.dataset.i18n];
		}

		function fill() {
			for (const el of fields) el.value = settings[el.id] || DEFAULTS[el.id];
		}

		function save() {
			ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
		}

		function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
			uuid = inUUID;
			localize(info);
			settings = JSON.parse(actionInfo).payload.settings || {};
			fill();

			ws = new WebSocket('ws://127.0.0.1:' + port);
			ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
		}

		for (const el of fields) {
			el.addEventListener('input', () => {
				settings[el.id] = el.value;
				save();
			});
		}

		document.getElementById('reset').addEventListener('click', () => {
			settings = { ...DEFAULTS };
			fill();
			save();
		});

		// Pure black when idle: pixels stay off on OLED screens.
		document.getElementById('oled').addEventListener('click', () => {
			settings.idleColor = '#000000';
			fill();
			save();
		});
	</script>
</body>
</html>
