<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
		label { display: block; margin-bottom: 4px; }
		select { width: 100%; padding: 4px; }
		.field { margin-bottom: 12px; }
		.colors { display: flex; gap: 16px; }
		input[type="color"] { width: 48px; height: 28px; padding: 0; border: 1px solid #555; border-radius: 4px; background: none; cursor: pointer; }
		button { padding: 4px 10px; cursor: pointer; }
		p { color: #999; font-size: 12px; }
	</style>
</head>
<body>
	<div class="field">
		<label for="metric" data-i18n="metric">Displayed limit</label>
		<select id="metric">
			<option value="five_hour" data-i18n="five_hour">Session (5h)</option>
			<option value="seven_day" data-i18n="seven_day">Weekly (7d)</option>
			<option value="both" data-i18n="both">Both</option>
			<option value="seven_day_opus" data-i18n="seven_day_opus">Weekly Opus</option>
			<option value="seven_day_sonnet" data-i18n="seven_day_sonnet">Weekly Sonnet</option>
		</select>
	</div>

	<div class="field colors">
		<div>
			<label for="bgColor" data-i18n="bgColor">Background</label>
			<input type="color" id="bgColor">
		</div>
		<div>
			<label for="ringColor" data-i18n="ringColor">Ring</label>
			<input type="color" id="ringColor">
		</div>
	</div>

	<div class="field">
		<button id="reset" data-i18n="reset">Default colors</button>
		<button id="oled" data-i18n="oled">OLED black</button>
	</div>

	<p data-i18n="help">The ring turns yellow at 70% and red at 90%. Press the key to see the time until reset.</p>

	<script>
		const DEFAULTS = { metric: 'five_hour', bgColor: '#1f1e1d', ringColor: '#d97757' };
		const fields = ['metric', 'bgColor', 'ringColor'].map((id) => document.getElementById(id));
		let ws, uuid, settings;

		const I18N = {
			fr: {
				metric: 'Limite affichée',
				five_hour: 'Session (5 h)',
				seven_day: 'Hebdomadaire (7 j)',
				both: 'Les deux',
				seven_day_opus: 'Hebdo Opus',
				seven_day_sonnet: 'Hebdo Sonnet',
				bgColor: 'Fond',
				ringColor: 'Cercle',
				reset: 'Couleurs par défaut',
				oled: 'Noir OLED',
				help: 'Le cercle passe en jaune à 70 % et en rouge à 90 %. Appuie sur la touche pour voir le temps avant le reset.',
			},
		};

		// English is written in the page; other languages replace each [data-i18n] text.
		function localize(info) {
			let lang;
			try {
				lang = JSON.parse(info).application.language;
			} catch {
				lang = navigator.language;
			}
			const strings = I18N[(lang || 'en').slice(0, 2).toLowerCase()];
			if (!strings) return;
			for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = strings[el.dataset.i18n];
		}

		function fill() {
			for (const el of fields) el.value = settings[el.id] || DEFAULTS[el.id];
		}

		function save() {
			ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
		}

		function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
			uuid = inUUID;
			localize(info);
			settings = JSON.parse(actionInfo).payload.settings || {};
			fill();

			ws = new WebSocket('ws://127.0.0.1:' + port);
			ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
		}

		for (const el of fields) {
			// 'input' so the key updates live while picking a color.
			el.addEventListener(el.type === 'color' ? 'input' : 'change', () => {
				settings[el.id] = el.value;
				save();
			});
		}

		document.getElementById('reset').addEventListener('click', () => {
			settings.bgColor = DEFAULTS.bgColor;
			settings.ringColor = DEFAULTS.ringColor;
			fill();
			save();
		});

		// Pure black: pixels stay off on OLED screens.
		document.getElementById('oled').addEventListener('click', () => {
			settings.bgColor = '#000000';
			fill();
			save();
		});
	</script>
</body>
</html>
