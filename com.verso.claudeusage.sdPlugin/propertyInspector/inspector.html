<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
		label { display: block; margin-bottom: 4px; }
		select { width: 100%; padding: 4px; }
		p { color: #999; font-size: 12px; }
	</style>
</head>
<body>
	<label for="metric">Limite affichée</label>
	<select id="metric">
		<option value="five_hour">Session (5 h)</option>
		<option value="seven_day">Hebdomadaire (7 j)</option>
		<option value="both">Les deux</option>
		<option value="seven_day_opus">Hebdo Opus</option>
		<option value="seven_day_sonnet">Hebdo Sonnet</option>
	</select>
	<p>Rafraîchi toutes les minutes. Appuie sur la touche pour forcer la mise à jour.</p>

	<script>
		let ws, uuid;
		const select = document.getElementById('metric');

		function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
			uuid = inUUID;
			const settings = JSON.parse(actionInfo).payload.settings || {};
			select.value = settings.metric || 'five_hour';

			ws = new WebSocket('ws://127.0.0.1:' + port);
			ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
		}

		select.addEventListener('change', () => {
			ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: { metric: select.value } }));
		});
	</script>
</body>
</html>
